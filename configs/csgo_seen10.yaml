# RDT CSGO Benchmark v2 Seen-10 localization config.
# The common/model/dataset sections retain the native RDT schema.  The
# benchmark adapter reads only the additional csgo/training/output sections.
schema_version: 1
model_name: RDT
model_type: VLA
task: localization

seed: 0
data_root: /home/jiahao/task/UniLIP/data/csgo_benchmark_v2
shared_eval_dir: /home/jiahao/task/csgo_benchmark_v2_eval_general
unilip_python: null  # Default: <shared_eval_dir>/.venv/bin/python

pretrained_model_name_or_path: .cache/csgo_seen10/models/rdt-1b
pretrained_text_encoder_name_or_path: .cache/csgo_seen10/models/t5-v1_1-xxl
pretrained_vision_encoder_name_or_path: .cache/csgo_seen10/models/siglip-so400m-patch14-384

output_root: outputs/csgo_benchmark_v2_seen10
checkpoint_root: checkpoints/csgo_benchmark_v2_seen10

common:
  img_history_size: 1
  action_chunk_size: 1
  num_cameras: 2
  state_dim: 128

dataset:
  buf_path: /path/to/buffer
  buf_num_chunks: 512
  buf_chunk_size: 512
  epsd_len_thresh_low: 32
  epsd_len_thresh_high: 2048
  image_aspect_ratio: pad
  tokenizer_max_length: 1024

model:
  lang_adaptor: mlp2x_gelu
  img_adaptor: mlp2x_gelu
  state_adaptor: mlp3x_gelu
  lang_token_dim: 4096
  img_token_dim: 1152
  state_token_dim: 128
  rdt:
    hidden_size: 2048
    depth: 28
    num_heads: 32
    cond_pos_embed_type: multimodal
  noise_scheduler:
    type: ddpm
    num_train_timesteps: 1000
    num_inference_timesteps: 5
    beta_schedule: squaredcos_cap_v2
    prediction_type: sample
    clip_sample: false
  ema:
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

csgo:
  maps:
    - cs_agency
    - cs_italy
    - de_ancient
    - de_anubis
    - de_dust2
    - de_inferno
    - de_mirage
    - de_nuke
    - de_overpass
    - de_train
  train_split: seen_train
  validation_split: seen_validation
  inference_split: seen_discrete_test
  horizon: 1
  num_cameras: 2
  state_dim: 128
  action_dim: 128
  active_action_dim: 5
  action_order: [x, y, z, pitch, yaw]
  prediction_pose_space: normalized
  state_is_zero: true
  state_is_masked: true
  language_embeddings: null

training:
  max_train_steps: 1000
  train_batch_size: 4
  eval_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 0
  dataloader_num_workers: 0
  mixed_precision: bf16
  # train_seen10.py derives checkpoint/eval cadence as max_train_steps / 5.
  validation_passes: 5
  save_passes: 5
  map_sampling: equal_map
  report_to: none

visualization:
  enabled: true
  samples_per_map: 10
  seed: 0

outputs:
  localization_predictions: localization/predictions.jsonl
  visualization: localization/visualization
  loss_curve: loss_curve.svg
  evaluation: evaluation/localization
